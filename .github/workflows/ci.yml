name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitwhistle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gitwhistle_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Validate migrations (up, full rollback, up)
        env:
          NODE_ENV: test
          APP_URL: http://localhost:5173
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gitwhistle_test
          REDIS_URL: redis://localhost:6379
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          node src/database/migrate.js latest
          node src/database/migrate.js down-all
          node src/database/migrate.js latest
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, client]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t gitwhistle-backend:ci backend
      - name: Build web image
        run: docker build -t gitwhistle-web:ci client
      - name: Image contains no secrets or keys
        run: |
          docker run --rm --entrypoint sh gitwhistle-backend:ci -c \
            'test ! -e /app/.env && test ! -e /app/keys && test -z "$(find /app -name "*.pem" -not -path "*/node_modules/*")"'
